platters:()=>`<span class="tag">Sharing is caring</span><h2>Grand platters</h2><p>Built for tables, families and late-night gangs.</p>${PL.map((p,i)=>`<div class="pl" ${i%2?'style="direction:rtl"':''}><div style="direction:ltr">${pic(p[3],50+i,240,p[0])}</div><div style="direction:ltr"><h3 style="font-size:1.5rem">${p[0]}</h3><span class="pr">${p[1].split(" · ")[0]}</span><p style="margin-top:8px">${p[2]}</p><a class="btn" href="#order">Order this</a></div></div>`).join("")}`,
experience:()=>`<div class="two"><div><span class="tag">The Tattukada experience</span><h2>Roadside soul, grand comfort</h2><p>A thattukada is Kerala’s late-night street stall: a wide iron tava, a glowing lamp, stacked parotta and a queue of happy strangers. We rebuilt that magic — hanging bulbs, steel plates, tea-glass clinks — with spotless hygiene and seating for everyone.</p><div class="tw"><span>Live tava counter</span><span>Kerala bulb lighting</span><span>Steel plates &amp; tea glasses</span><span>Family seating</span><span>Car service</span></div></div><div class="cart">${art("bread",77,260)}</div></div><h2 style="margin-top:34px">How a night at Nashwas goes</h2><div class="steps"><div>Walk up to the glowing counter and watch parotta being slapped, layered and torn.</div><div>Pick a gravy — salna with chicken, egg, fish or veg.</div><div>Hear the rhythm of the kothu blades on the hot tava.</div><div>Sip sulaimani from a glass while biriyani is opened fresh from the dum.</div><div>Finish with unnakaya, kinnathappam or a rose falooda.</div></div>`,
story:()=>`<div class="two"><div><span class="tag">Malabar story</span><h2>From Kozhikode kitchens to your table</h2><p>Malabar cuisine grew where Arab traders, Mappila families and Kerala spices met. Thalassery biriyani, pathiri, kaipola, mutta mala and kallummakkaya are the heart of that story.</p><p>Nashwas Grand Thattukada keeps those recipes honest: coconut-oil tempering, hand-ground masala, kaima rice for biriyani and small-batch dum cooking. Every plate is cooked fresh, in the order you place it.</p></div><div class="cart">${art("rice",31,260)}</div></div><div class="grid" style="margin-top:26px">${[["Mappila heritage","Thalassery biriyani & pathiri tradition"],["Spice-first","Fresh black pepper, fennel, cardamom"],["Coconut-oil cooking","The authentic flavour base"],["Fresh every order","Cooked to order, never reheated"]].map(x=>`<div class="card"><div class="b"><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join("")}</div>`,
gallery:()=>`<span class="tag">Gallery</span><h2>Plates, platters &amp; midnight glow</h2><div class="grid">${GAL.map((g,i)=>`<div class="card">${pic(g[1],200+i,g[1]=="fry"?260:200,g[0])}<div class="b"><p style="margin:0">${g[0]}</p></div></div>`).join("")}</div><p style="margin-top:14px;font-size:.8rem">Illustrated artwork. Replace with your own food photography when ready.</p>`,
order:()=>`<div class="two" style="align-items:start"><div><span class="tag">Reserve &amp; order</span><h2>Book your table</h2><p>Reserve for dining or pre-order a platter for pickup. We’ll confirm by phone.</p></div><form id="f"><div><label>Name</label><input required id="n"></div><div><label>Phone</label><input required type="tel" id="t"></div><div><label>Type</label><select id="ty"><option>Dine-in table</option><option>Takeaway pre-order</option><option>Platter pre-order</option></select></div><div><label>Date &amp; time</label><input type="datetime-local" required id="d"></div><div><label>Guests / notes</label><textarea rows="3" id="g" placeholder="4 guests · no spice · Mandi platter"></textarea></div><button class="btn">Send request</button><div class="ok" id="ok"></div></form></div>`,
contact:()=>`<div class="two"><div><span class="tag">Find us</span><h2>Visit the thattukada</h2><p><b>Nashwas Grand Thattukada</b><br>Malabar, Kerala — add street address here</p><p><b>Hours:</b> 5 pm – 3 am, every day<br><b>Phone / WhatsApp:</b> add number here<br><b>Instagram:</b> @nashwasgrandthattukada</p><div class="tw"><span>Dine-in</span><span>Takeaway</span><span>Car service</span><span>Family area</span><span>Parking</span></div></div><div class="cart">${art("drink",12,260)}</div></div>`};
V.snacks=()=>{const L=SN.filter(s=>sa=="All"||s[4]==sa),A={T:"Thalassery",K:"Kozhikode",B:"Both towns"};return `<span class="tag">Malabar snacks</span><h2>${SN.length} Thalassery &amp; Kozhikode snacks</h2><p>Palaharam from the two food capitals of Malabar, fried, steamed and sweetened to order.</p><div class="tabs" id="stabs">${[["All","All"],["T","Thalassery"],["K","Kozhikode"],["B","Both towns"]].map(x=>`<button data-a="${x[0]}" class="${x[0]==sa?"on":""}">${x[1]}</button>`).join("")}</div><div class="grid">${L.map((s,i)=>`<div class="card">${pic(s[2],300+i,0,s[0])}<div class="b"><h3><span class="v ${s[3]=="n"?"n":""}"></span>${s[0]}</h3><p>${s[1]}</p><div class="tw"><span>${A[s[4]]}</span></div></div></div>`).join("")}</div>`};
function go(){const h=(location.hash||"#home").slice(1),k=V[h]?h:"home";document.getElementById("m").innerHTML=`<section class="pg on">${V[k]()}</section>`;document.getElementById("nav").innerHTML=P.map(p=>`<a href="#${p[0]}" class="${p[0]==k?"on":""}">${p[1]}</a>`).join("");if(!window.kp)scrollTo(0,0);window.kp=0;bind();hy()}
function bind(){const t=document.getElementById("tabs");if(t)t.onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;seed=1;kp=1;go()}};const ct=document.getElementById("ctabs");if(ct)ct.onclick=e=>{if(e.target.dataset.k){cc=e.target.dataset.k;seed=1;kp=1;go()}};const st=document.getElementById("stabs");if(st)st.onclick=e=>{if(e.target.dataset.a){sa=e.target.dataset.a;kp=1;go()}};const f=document.getElementById("f");if(f)f.onsubmit=e=>{e.preventDefault();const o=document.getElementById("ok");o.style.display="block";o.textContent="Thank you, "+document.getElementById("n").value+"! Your request has been noted — we’ll call to confirm."};document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>location.hash=x.dataset.go)}
const DB=new Promise(r=>{try{const q=indexedDB.open("ntk",1);q.onupgradeneeded=()=>q.result.createObjectStore("p");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const rq=(m,k,v)=>DB.then(d=>d&&new Promise(r=>{try{const s=d.transaction("p",m=="get"?"readonly":"readwrite").objectStore("p"),q=m=="get"?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}}));
function hy(){document.querySelectorAll(".pw").forEach(w=>rq("get",w.dataset.s).then(b=>{if(b){w.querySelectorAll("img.up").forEach(i=>i.remove());const i=document.createElement("img");i.className="up";i.src=URL.createObjectURL(b);i.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover";w.appendChild(i)}}))}
let cur;document.addEventListener("click",e=>{if(e.target.classList.contains("ab")){cur=e.target.parentNode.dataset.s;document.getElementById("fi").click()}if(e.target.id=="ed"){e.preventDefault();document.body.classList.toggle("ed")}});
document.getElementById("fi").onchange=e=>{const f=e.target.files[0];if(f&&cur)rq("put",cur,f).then(()=>{hy();e.target.value=""})};
addEventListener("hashchange",go);go();
</script></body></html>
